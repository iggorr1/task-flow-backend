spring.application.name=task-flow-backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
telegram.webhook.secret=${TELEGRAM_WEBHOOK_SECRET:local-dev-secret}
telegram.bot.username=${TELEGRAM_BOT_USERNAME:taskflow_reminders_ik_bot}
telegram.bot.token=${TELEGRAM_BOT_TOKEN}
frontend.url=${FRONTEND_URL:https://wwwho.lol}

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:local-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:local-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,email,profile

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.baseline-description=Existing TaskFlow schema

jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION}
